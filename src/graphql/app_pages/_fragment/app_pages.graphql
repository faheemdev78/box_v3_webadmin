#import "../../_fragment/error.graphql"
#import "./AppPageStyles.graphql"


fragment AppPagesInfo on AppPages {
  _id
  title
  slug
  deleteable
  draft
  description
  page_type { title type }
  styles { ...AppPageStylesInfo }
  p_limit

  published
  scheduled_from
  scheduled_to

  created_by { name }
  last_updated_by { name }

  createdAt
  updatedAt

  error {...ErrorInfo}
}
