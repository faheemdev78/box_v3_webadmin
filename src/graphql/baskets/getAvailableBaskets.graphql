query GetAvailableBaskets($_id_store: ID!, $category: String!, $limit: Int, $filter: String) {
  getAvailableBaskets(_id_store: $_id_store, category: $category, limit: $limit, filter: $filter) {
    baskets {
      _id
      title
      barcode
      color
      status
    }
    total_available
    error {
      message
    }
  }
}