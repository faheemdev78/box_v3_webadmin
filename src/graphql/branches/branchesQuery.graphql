#import "../_fragment/paginationResults.graphql"
#import "../_fragment/error.graphql"
#import "./_fragment/branch.graphql"

query branchesQuery($limit: Int, $page: Int, $filter: String, $others: String) {
    storesQuery(limit: $limit, page: $page, filter: $filter, others: $others) {
        pagination { ...PaginationResultsInfo }
        edges { ...BranchInfo }
        error { ...ErrorInfo }
    }
}
