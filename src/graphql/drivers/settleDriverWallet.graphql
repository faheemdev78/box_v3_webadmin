#import "../_fragment/error.graphql"
#import "../_fragment/success.graphql"

mutation settleDriverWallet(
  $_id_session: String!
  $_id_driver: ID!
  $amount_deposited: Float!
) {
  settleDriverWallet(
    _id_session: $_id_session
    _id_driver: $_id_driver
    amount_deposited: $amount_deposited
  ) {
    session {
      _id
      driver_wallet {
        total_cod_collected
        deposited_amount
        pending_deposit
        is_settled
        settled_at
      }
    }
    success { ...SuccessInfo }
    error { ...ErrorInfo }
  }
}