mutation resetOrderToZero($_id_order: String!) {
  resetOrderToZero(_id_order: $_id_order) {
    success
    error {
      message
      code
    }
    data {
      _id
      serial
      status {
        order
      }
      resources_released {
        picker_baskets_released
        delivery_baskets_released
        staff_assignments_cleared
        till_queue_cleared
        inventory_restored
      }
      cancellation_record {
        cancelled_at
        cancelled_by
        reason
      }
    }
  }
}