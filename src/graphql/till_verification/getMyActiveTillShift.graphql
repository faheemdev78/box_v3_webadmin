#import "../_fragment/error.graphql"
#import "../_fragment/success.graphql"

query GetMyActiveTillShift {
  getMyActiveTillShift {
    session {
      _id
      _id_staff
      _id_store
      session_type
      status
      session_started_at
      session_completed_at
      total_session_time
      performance {
        total_units_processed
        successful_units
        failed_units
        average_time_per_unit
        units_per_hour
        accuracy_rate
        error_rate
      }
      till_verification_orders {
        _id_order
        order_serial
        order_status
        delivery_baskets
        started_at
        held_at
        completed_at
        hold_reason
        completion_notes
      }
      staff_notes
    }
    success {
      ...SuccessInfo
    }
    error {
      ...ErrorInfo
    }
  }
}