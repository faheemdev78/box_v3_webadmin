#import "../_fragment/error.graphql"
#import "../_fragment/success.graphql"

mutation resumeTillVerificationSession($_id_session: ID!) {
    resumeTillVerificationSession(_id_session: $_id_session) {
        session {
            _id
            _id_order
            _id_staff
            _id_store
            status
            started_at
            held_at
            order_data {
                _id
                serial
                customer {
                    _id
                    name
                }
                current_order {
                    handled_by {
                        _id
                        name
                    }
                    baskets {
                        _id
                        title
                        barcode
                        color
                    }
                    items {
                        _id_product
                        title
                        barcode
                        qty
                        price
                        total
                        status
                    }
                    totals {
                        subtotal
                        taxAmount
                        grandTotal
                        discountTotal
                    }
                }
                delivery_slot {
                    _id_slot
                    start_date
                    end_date
                    start_time
                    end_time
                    day
                }
            }
            progress {
                items {
                    _id_item
                    status
                    qty_expected
                    qty_verified
                    notes
                    verified_at
                }
                stats {
                    total_items
                    verified_count
                    pending_count
                    missing_count
                    mismatch_count
                    completion_percentage
                }
            }
        }
        success {
            ...SuccessInfo
        }
        error {
            ...ErrorInfo
        }
    }
}